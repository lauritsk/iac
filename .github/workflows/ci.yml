name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  connect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          version: latest
          hostname: iac-ci-${{ github.run_id }}-${{ github.run_attempt }}
          ping: hv01.cormo-tegu.ts.net

      - name: Set up Incus
        env:
          INCUS_CLIENT_CERT: ${{ secrets.INCUS_CLIENT_CERT }}
          INCUS_CLIENT_KEY: ${{ secrets.INCUS_CLIENT_KEY }}
          INCUS_SERVER_CERT: ${{ vars.INCUS_SERVER_CERT }}
        run: |
          umask 077
          export INCUS_CONF="$RUNNER_TEMP/incus"
          echo "INCUS_CONF=$INCUS_CONF" >> "$GITHUB_ENV"
          mkdir -p "$INCUS_CONF/servercerts" "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' \
            https://github.com/lxc/incus/releases/download/v7.5.1/bin.linux.incus.x86_64 \
            -o "$RUNNER_TEMP/bin/incus"
          echo "7bd6223b369f4d693fcde695bd8549a73b5b3d403735329212483702aa22c179  $RUNNER_TEMP/bin/incus" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bin/incus"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$INCUS_CLIENT_CERT" > "$INCUS_CONF/client.crt"
          printf '%s\n' "$INCUS_CLIENT_KEY" > "$INCUS_CONF/client.key"
          printf '%s\n' "$INCUS_SERVER_CERT" > "$INCUS_CONF/servercerts/hv01.crt"
          incus remote add hv01 https://hv01.cormo-tegu.ts.net:8443 --project default

      - name: Verify Incus access
        run: |
          incus list hv01: --project default --columns ns

      - name: Remove Incus credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/incus"
