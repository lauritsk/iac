name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  connect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          version: latest
          hostname: iac-ci-${{ github.run_id }}-${{ github.run_attempt }}
          ping: hv01.cormo-tegu.ts.net

      - name: Install Incus CLI
        shell: bash
        run: |
          echo "INCUS_CONF=$RUNNER_TEMP/incus" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/lxc/incus/releases/download/v7.5.1/bin.linux.incus.x86_64 \
            --output "$RUNNER_TEMP/bin/incus"
          printf '%s  %s\n' \
            7bd6223b369f4d693fcde695bd8549a73b5b3d403735329212483702aa22c179 \
            "$RUNNER_TEMP/bin/incus" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/bin/incus"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Configure Incus credentials
        shell: bash
        env:
          INCUS_CLIENT_CERT: ${{ secrets.INCUS_CLIENT_CERT }}
          INCUS_CLIENT_KEY: ${{ secrets.INCUS_CLIENT_KEY }}
          INCUS_SERVER_CERT: ${{ vars.INCUS_SERVER_CERT }}
        run: |
          umask 077
          test -n "$INCUS_CLIENT_CERT"
          test -n "$INCUS_CLIENT_KEY"
          test -n "$INCUS_SERVER_CERT"
          mkdir -p "$INCUS_CONF/servercerts"
          printf '%s\n' "$INCUS_CLIENT_CERT" > "$INCUS_CONF/client.crt"
          printf '%s\n' "$INCUS_CLIENT_KEY" > "$INCUS_CONF/client.key"
          printf '%s\n' "$INCUS_SERVER_CERT" > "$INCUS_CONF/servercerts/hv01.crt"
          cat > "$INCUS_CONF/config.yml" <<'EOF'
          default-remote: hv01
          remotes:
            hv01:
              addr: https://hv01.cormo-tegu.ts.net:8443
              auth_type: tls
              project: default
              protocol: incus
          EOF

      - name: Verify Incus access
        run: |
          incus list hv01: --project default --columns ns

      - name: Remove Incus credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/incus"
