---
- name: Ensure Radarr directory exists
  ansible.builtin.file:
    path: /mnt/fast/radarr/config
    state: directory
    owner: core
    group: core
    mode: '0700'

- name: Ensure Radarr API key secret is present
  containers.podman.podman_secret:
    name: radarr_api_key
    data: '{{ radarr_api_key }}'
    state: present
    force: true
  no_log: true
  notify: Restart Radarr service

- name: Ensure Radarr image is present
  containers.podman.podman_image:
    name: lscr.io/linuxserver/radarr:latest
    state: present
    pull: true
  notify: Restart Radarr service

- name: Ensure Radarr Quadlet is defined
  containers.podman.podman_container:
    name: radarr
    state: quadlet
    image: lscr.io/linuxserver/radarr:latest
    env:
      # PUID: 1000
      # PGID: 1000
      TZ: Europe/Tallinn
      # RADARR__APP__INSTANCENAME: ''
      # RADARR__APP__THEME: ''
      # RADARR__APP__LAUNCHBROWSER: ''
      FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_api_key
      # RADARR__AUTH__ENABLED: ''
      # RADARR__AUTH__METHOD: ''
      # RADARR__AUTH__REQUIRED: ''
      # RADARR__AUTH__TRUSTCGNATIPADDRESSES: ''
      # RADARR__LOG__LEVEL: ''
      # RADARR__LOG__FILTERSENTRYEVENTS: ''
      # RADARR__LOG__ROTATE: ''
      # RADARR__LOG__SIZELIMIT: ''
      # RADARR__LOG__SQL: ''
      # RADARR__LOG__CONSOLELEVEL: ''
      # RADARR__LOG__CONSOLEFORMAT: ''
      # RADARR__LOG__ANALYTICSENABLED: ''
      # RADARR__LOG__SYSLOGSERVER: ''
      # RADARR__LOG__SYSLOGPORT: ''
      # RADARR__LOG__SYSLOGLEVEL: ''
      # RADARR__LOG__DBENABLED: ''
      # RADARR__POSTGRES__HOST: ''
      # RADARR__POSTGRES__PORT: ''
      # RADARR__POSTGRES__USER: ''
      # RADARR__POSTGRES__PASSWORD: ''
      # RADARR__POSTGRES__MAINDB: ''
      # RADARR__POSTGRES__LOGDB: ''
      # RADARR__POSTGRES__MAINDBCONNECTIONSTRING: ''
      # RADARR__POSTGRES__LOGDBCONNECTIONSTRING: ''
      # RADARR__SERVER__URLBASE: ''
      # RADARR__SERVER__BINDADDRESS: ''
      # RADARR__SERVER__PORT: ''
      # RADARR__SERVER__ENABLESSL: ''
      # RADARR__SERVER__SSLPORT: ''
      # RADARR__SERVER__SSLCERTPATH: ''
      # RADARR__SERVER__SSLCERTPASSWORD: ''
      # RADARR__UPDATE__MECHANISM: ''
      # RADARR__UPDATE__AUTOMATICALLY: ''
      # RADARR__UPDATE__SCRIPTPATH: ''
      # RADARR__UPDATE__BRANCH: ''
      # UMASK: '022'
    secrets:
      - radarr_api_key,type=mount,target=/run/secrets/radarr_api_key,uid=1000,gid=1000,mode=0400
    label:
      io.containers.autoupdate: registry
    network:
      - proxy.network
    mount:
      - type=tmpfs,destination=/run,U=true,exec
      - type=tmpfs,destination=/tmp,U=true,exec
      - type=tmpfs,destination=/var/tmp,U=true,exec
    volume:
      - /mnt/fast/radarr/config:/config
      - /mnt/slow:/data
    read_only: true
    user: 1000:1000
    userns: keep-id:uid=1000,gid=1000
    security_opt:
      - no-new-privileges
    memory: 1G
    pids_limit: '256'
    cpus: '2'
    healthcheck: curl -fsS http://127.0.0.1:7878/ >/dev/null || exit 1
    restart_policy: always
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  notify: Restart Radarr service
