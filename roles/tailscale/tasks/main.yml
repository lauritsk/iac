---
- name: Ensure Tailscale directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: core
    group: core
    mode: '0700'
  loop:
    - /mnt/fast/tailscale/config
    - /mnt/fast/tailscale/data

- name: Ensure Tailscale OAuth secret is present
  containers.podman.podman_secret:
    name: tailscale_oauth_secret
    data: '{{ tailscale_oauth_secret }}'
    state: present
    force: true
  no_log: true
  notify: Restart Tailscale service

- name: Ensure Tailscale configuration is deployed
  ansible.builtin.copy:
    src: serve.json
    dest: /mnt/fast/tailscale/config/serve.json
    owner: core
    group: core
    mode: '0600'
  notify: Restart Tailscale service

- name: Ensure Tailscale image is present
  containers.podman.podman_image:
    name: dhi.io/tailscale:1
    state: present
    pull: true
  notify: Restart Tailscale service

- name: Ensure Tailscale Quadlet is defined
  containers.podman.podman_container:
    name: tailscale
    state: quadlet
    image: dhi.io/tailscale:1
    env:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
      TS_AUTH_ONCE: 'true'
      TS_HOSTNAME: proxy
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: 'true'
    secrets:
      - tailscale_oauth_secret,type=env,target=TS_AUTHKEY
    label:
      io.containers.autoupdate: registry
    network:
      - proxy.network
    tmpfs:
      /tmp: rw,nosuid,nodev,mode=1777
      /run: rw,nosuid,nodev,mode=755
    volume:
      - /mnt/fast/tailscale/data:/var/lib/tailscale
      - /mnt/fast/tailscale/config/serve.json:/config/serve.json:ro
    read_only: true
    user: 1000:1000
    userns: keep-id:uid=1000,gid=1000
    security_opt:
      - no-new-privileges
    memory: 512M
    pids_limit: '256'
    cpus: '1'
    restart_policy: always
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  notify: Restart Tailscale service
