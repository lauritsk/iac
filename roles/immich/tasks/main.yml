---
- name: Ensure Immich directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: core
    group: core
    mode: '0700'
  loop:
    - /mnt/fast/immich/config
    - /mnt/fast/immich/postgres
    - /mnt/fast/immich/model-cache
    - /mnt/fast/immich/valkey
    - /mnt/slow/immich/library

- name: Ensure Immich configuration is deployed
  ansible.builtin.copy:
    src: config.json
    dest: /mnt/fast/immich/config/config.json
    owner: core
    group: core
    mode: '0400'
  no_log: true
  notify: Restart Immich pod service

- name: Ensure Immich Valkey config is present
  ansible.builtin.template:
    src: valkey.conf.j2
    dest: /mnt/fast/immich/valkey/valkey.conf
    owner: core
    group: core
    mode: '0400'
  notify: Restart Immich pod service

- name: Ensure Immich secrets are present
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    state: present
    force: true
  loop:
    - name: immich_db_hostname
      data: '{{ immich_db_hostname }}'
    - name: immich_db_name
      data: '{{ immich_db_name }}'
    - name: immich_db_username
      data: '{{ immich_db_username }}'
    - name: immich_db_password
      data: '{{ immich_db_password }}'
    - name: immich_valkey_password
      data: '{{ immich_valkey_password }}'
  loop_control:
    label: '{{ item.name }}'
  no_log: true
  notify: Restart Immich pod service

- name: Ensure Immich images are present
  containers.podman.podman_image:
    name: '{{ item }}'
    state: present
    pull: true
  loop:
    - ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    - docker.io/valkey/valkey:9
    - ghcr.io/immich-app/immich-machine-learning:release-openvino
    - ghcr.io/immich-app/immich-server:release
  notify: Restart Immich pod service

- name: Ensure Immich pod Quadlet is defined
  containers.podman.podman_pod:
    name: immich
    state: quadlet
    network:
      - proxy.network
    userns: keep-id:uid=1000,gid=1000
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
  notify: Restart Immich pod service

- name: Ensure Immich PostgreSQL Quadlet is defined
  containers.podman.podman_container:
    name: immich-postgres
    state: quadlet
    pod: immich.pod
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    env:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - immich_db_password,type=env,target=POSTGRES_PASSWORD
    label:
      io.containers.autoupdate: registry
    volume:
      - /mnt/fast/immich/postgres:/var/lib/postgresql/data
    user: 1000:1000
    security_opt:
      - no-new-privileges
    cap_drop:
      - CAP_NET_RAW
    memory: 2G
    pids_limit: '512'
    cpus: '2'
    shm_size: 128m
    healthcheck: pg_isready -U immich -d immich
    restart_policy: always
  notify: Restart Immich pod service

- name: Ensure Immich Valkey Quadlet is defined
  containers.podman.podman_container:
    name: immich-valkey
    state: quadlet
    pod: immich.pod
    image: docker.io/valkey/valkey:9
    command: valkey-server /etc/valkey/valkey.conf
    label:
      io.containers.autoupdate: registry
    volume:
      - /mnt/fast/immich/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    user: 1000:1000
    security_opt:
      - no-new-privileges
    cap_drop:
      - CAP_NET_RAW
    memory: 512M
    pids_limit: '256'
    cpus: '1'
    healthcheck: valkey-cli -a $(cat /run/secrets/valkey_password) ping || exit 1
    restart_policy: always
  notify: Restart Immich pod service

- name: Ensure Immich machine learning Quadlet is defined
  containers.podman.podman_container:
    name: immich-machine-learning
    state: quadlet
    pod: immich.pod
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      # IMMICH_ENV: production
      # IMMICH_LOG_LEVEL: log
      # NO_COLOR: false
      # IMMICH_HOST: 0.0.0.0
      # IMMICH_PORT: 3003
      # MACHINE_LEARNING_MODEL_TTL: 300
      # MACHINE_LEARNING_MODEL_TTL_POLL_S: 10
      # MACHINE_LEARNING_CACHE_FOLDER: /cache
      # MACHINE_LEARNING_REQUEST_THREADS: 4
      # MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      # MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 2
      # MACHINE_LEARNING_WORKERS: 1
      # MACHINE_LEARNING_HTTP_KEEPALIVE_TIMEOUT_S: 2
      # MACHINE_LEARNING_WORKER_TIMEOUT: 300
      # MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: ''
      # MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: ''
      # MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION: ''
      # MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION: ''
      # MACHINE_LEARNING_PRELOAD__OCR__RECOGNITION: ''
      # MACHINE_LEARNING_PRELOAD__OCR__DETECTION: ''
      # MACHINE_LEARNING_ANN: True
      # MACHINE_LEARNING_ANN_FP16_TURBO: False
      # MACHINE_LEARNING_ANN_TUNING_LEVEL: 2
      # MACHINE_LEARNING_DEVICE_IDS: 0
      # MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION: 1
      # MACHINE_LEARNING_MAX_BATCH_SIZE__OCR: 6
      # MACHINE_LEARNING_RKNN: True
      # MACHINE_LEARNING_RKNN_THREADS: 1
      # MACHINE_LEARNING_MODEL_ARENA: true
      # MACHINE_LEARNING_OPENVINO_PRECISION: FP32
    label:
      io.containers.autoupdate: registry
    volume:
      - /mnt/fast/immich/model-cache:/cache
    user: 1000:1000
    group_add:
      - keep-groups
    security_opt:
      - no-new-privileges
    cap_drop:
      - CAP_NET_RAW
    memory: 4G
    pids_limit: '512'
    cpus: '4'
    device:
      - /dev/dri:/dev/dri
    healthcheck: python3 -m urllib.request http://127.0.0.1:3003/
    restart_policy: always
  notify: Restart Immich pod service

- name: Ensure Immich server Quadlet is defined
  containers.podman.podman_container:
    name: immich-server
    state: quadlet
    pod: immich.pod
    image: ghcr.io/immich-app/immich-server:release
    env:
      # IMMICH_VERSION: v3
      # UPLOAD_LOCATION: ''
      # DB_DATA_LOCATION: ''
      TZ: Europe/Tallinn
      # IMMICH_ENV: production
      # IMMICH_LOG_LEVEL: log
      # IMMICH_LOG_FORMAT: console
      # IMMICH_MEDIA_LOCATION: /data
      IMMICH_CONFIG_FILE: /config.json
      # IMMICH_HELMET_FILE: false
      # NO_COLOR: false
      # CPU_CORES: 4
      # IMMICH_API_METRICS_PORT: 8081
      # IMMICH_MICROSERVICES_METRICS_PORT: 8082
      # IMMICH_PROCESS_INVALID_IMAGES: false
      # IMMICH_TRUSTED_PROXIES: ''
      # IMMICH_IGNORE_MOUNT_CHECK_ERRORS: false
      IMMICH_ALLOW_SETUP: false
      # IMMICH_WORKERS_INCLUDE: ''
      # IMMICH_WORKERS_EXCLUDE: ''
      # IMMICH_HOST: 0.0.0.0
      # IMMICH_PORT: 2283
      # DB_URL_FILE: ''
      DB_HOSTNAME_FILE: /run/secrets/immich_db_hostname
      DB_PORT: 5432
      DB_USERNAME_FILE: /run/secrets/immich_db_username
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME_FILE: /run/secrets/immich_db_name
      # DB_SSL_MODE: ''
      # DB_VECTOR_EXTENSION:
      # DB_SKIP_MIGRATIONS: false
      # DB_STORAGE_TYPE: SSD
      # REDIS_URL: ''
      # REDIS_SOCKET: ''
      REDIS_HOSTNAME: 127.0.0.1
      REDIS_PORT: 6379
      # REDIS_USERNAME: ''
      REDIS_PASSWORD_FILE: /run/secrets/immich_valkey_password
      # REDIS_DBINDEX: 0
      # IMMICH_TELEMETRY_INCLUDE: ''
      # IMMICH_TELEMETRY_EXCLUDE: ''
      IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
    secrets:
      - immich_db_hostname,type=mount,target=/run/secrets/immich_db_hostname
      - immich_db_name,type=mount,target=/run/secrets/immich_db_name
      - immich_db_username,type=mount,target=/run/secrets/immich_db_username
      - immich_db_password,type=mount,target=/run/secrets/immich_db_password
      - immich_valkey_password,type=mount,target=/run/secrets/immich_valkey_password
    label:
      io.containers.autoupdate: registry
    volume:
      - /mnt/fast/immich/config/config.json:/config.json:ro
      - /mnt/slow/immich/library:/data
    user: 1000:1000
    group_add:
      - keep-groups
    security_opt:
      - no-new-privileges
    cap_drop:
      - CAP_NET_RAW
    memory: 4G
    pids_limit: '512'
    cpus: '4'
    device:
      - /dev/dri:/dev/dri
    healthcheck: curl -fsS http://127.0.0.1:2283/api/server/ping >/dev/null || exit 1
    restart_policy: always
  notify: Restart Immich pod service
