---
- name: Ensure Jellyfin directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: core
    group: core
    mode: '0700'
  loop:
    - /mnt/fast/jellyfin/config
    - /mnt/fast/jellyfin/cache

- name: Ensure Jellyfin image is present
  containers.podman.podman_image:
    name: lscr.io/linuxserver/jellyfin:latest
    state: present
    pull: true
    auth_file: /home/core/.config/containers/auth.json
  notify: Restart Jellyfin service

- name: Ensure Jellyfin Quadlet is defined
  containers.podman.podman_container:
    name: jellyfin
    state: quadlet
    image: lscr.io/linuxserver/jellyfin:latest
    label:
      io.containers.autoupdate: registry
    memory: 4G
    pids_limit: '512'
    cpus: '4'
    env:
      TZ: Europe/Tallinn
      JELLYFIN_PublishedServerUrl: https://jellyfin.cormo-tegu.ts.net
    userns: keep-id:uid=1000,gid=1000
    group_add:
      - keep-groups
    read_only: true
    security_opt:
      - no-new-privileges
    mount:
      - type=tmpfs,destination=/run,U=true,exec
    volume:
      - /mnt/fast/jellyfin/config:/config
      - /mnt/fast/jellyfin/cache:/cache
      - /mnt/slow:/media
    network:
      - proxy.network
    device:
      - /dev/dri/:/dev/dri/
    healthcheck: curl --noproxy localhost -Lk -fsS http://127.0.0.1:8096/health || exit 1
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
    user: 1000:1000
    restart_policy: always
  notify: Restart Jellyfin service
