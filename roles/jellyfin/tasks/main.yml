---
- name: Ensure Jellyfin directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: core
    group: core
    mode: '0700'
  loop:
    # - /mnt/fast/jellyfin/data
    - /mnt/fast/jellyfin/config
    - /mnt/fast/jellyfin/cache
    # - /mnt/fast/jellyfin/web
    # - /mnt/fast/jellyfin/logs

- name: Ensure Jellyfin image is present
  containers.podman.podman_image:
    name: ghcr.io/jellyfin/jellyfin:latest
    state: present
    pull: true
  notify: Restart Jellyfin service

- name: Ensure Jellyfin Quadlet is defined
  containers.podman.podman_container:
    name: jellyfin
    state: quadlet
    image: ghcr.io/jellyfin/jellyfin:latest
    label:
      io.containers.autoupdate: registry
    memory: 4G
    pids_limit: '512'
    cpus: '4'
    env:
      TZ: Europe/Tallinn
      # JELLYFIN_DATA_DIR: /data
      # JELLYFIN_CONFIG_DIR: /config
      # JELLYFIN_CACHE_DIR: /cache
      # JELLYFIN_WEB_DIR: /web
      # JELLYFIN_LOG_DIR: /logs
      # JELLYFIN_hostwebclient: True
      # JELLYFIN_FFmpeg__probesize: "1G"
      # JELLYFIN_FFmpeg__analyzeduration: "200M"
      JELLYFIN_PublishedServerUrl: https://jellyfin.cormo-tegu.ts.net
    userns: keep-id:uid=1000,gid=1000
    group_add:
      - keep-groups
    read_only: true
    security_opt:
      - no-new-privileges
    mount:
      - type=tmpfs,destination=/run,U=true,exec
      - type=tmpfs,destination=/tmp,U=true,exec
      - type=tmpfs,destination=/var/tmp,U=true,exec
    volume:
      # - /mnt/fast/jellyfin/data:/data
      - /mnt/fast/jellyfin/config:/config
      - /mnt/fast/jellyfin/cache:/cache
      # - /mnt/fast/jellyfin/web:/web
      # - /mnt/fast/jellyfin/logs:/logs
      - /mnt/slow:/media
    network:
      - proxy.network
    device:
      - /dev/dri/:/dev/dri/
    healthcheck: curl --noproxy localhost -Lk -fsS http://127.0.0.1:8096/health || exit 1
    quadlet_options:
      - |
        [Install]
        WantedBy=default.target
    user: 1000:1000
    restart_policy: always
  notify: Restart Jellyfin service
