[settings]
experimental = true
lockfile = true
locked = true
pin = true

[tools]
opentofu = "1.12.6"
"aqua:lxc/incus" = "7.4.0"

[env]
TF_VAR_incus_address = "https://hv01.cormo-tegu.ts.net:8443"
AWS_ACCESS_KEY_ID = { age = "" }
AWS_SECRET_ACCESS_KEY = { age = "" }
TAILSCALE_OAUTH_CLIENT_ID = { age = "" }
TAILSCALE_OAUTH_CLIENT_SECRET = { age = "" }
TF_VAR_zerobyte_app_secret = { age = "" }
TF_VAR_immich_db_name = { age = "" }
TF_VAR_immich_db_password = { age = "" }
TF_VAR_immich_db_username = { age = "" }
TF_VAR_transmission_password = { age = "" }
TF_VAR_transmission_username = { age = "" }
TF_VAR_prowlarr_api_key = { age = "" }
TF_VAR_radarr_api_key = { age = "" }
TF_VAR_sonarr_api_key = { age = "" }

[tasks."tofu:init"]
description = "Initializes the OpenTofu working directory"
run = "tofu init"

[tasks."tofu:plan"]
description = "Generates an execution plan for OpenTofu"
depends = ["tofu:init"]
run = "tofu plan"

[tasks."tofu:apply"]
description = "Applies the changes required to reach the desired state of the configuration"
depends = ["tofu:init"]
interactive = true
run = "tofu apply"

[tasks."tofu:destroy"]
description = "Destroy OpenTofu-managed infrastructure"
depends = ["tofu:init"]
interactive = true
run = "tofu destroy"

[tasks."tofu:validate"]
description = "Validates the OpenTofu files"
depends = ["tofu:init"]
run = "tofu validate"

[tasks."tofu:format"]
description = "Formats the OpenTofu files"
run = "tofu fmt"

[tasks."tofu:format-check"]
description = "Check formatting without changing files"
run = "tofu fmt -check"

[tasks."tofu:check"]
description = "Check formatting and validate the configuration"
depends = ["tofu:format-check", "tofu:validate"]
