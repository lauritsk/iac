[tools]
"aqua:lxc/incus" = "latest"
opentofu = "latest"

[tasks.init]
description = "Install providers and initialize OpenTofu"
run = "tofu init"

[tasks.fmt]
description = "Format OpenTofu files"
run = "tofu fmt -check -recursive"

[tasks.validate]
description = "Validate the OpenTofu configuration"
depends = ["fmt"]
run = "tofu validate"

[tasks.plan]
description = "Preview infrastructure changes"
run = "tofu plan -out=homelab.tfplan"

[tasks.apply]
description = "Apply the saved infrastructure plan"
confirm = "Apply homelab.tfplan?"
run = "tofu apply homelab.tfplan"
