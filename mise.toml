[settings]
experimental = true

[tools]
"aqua:lxc/incus" = "latest"
opentofu = "latest"

[env]
INCUS_CLIENT_CERT = { age = "" }
INCUS_CLIENT_KEY = { age = "" }
INCUS_SERVER_CERT = { age = { value = "", format = "zstd" } }
TF_VAR_beszel_agent_key = { age = "" }
TF_VAR_beszel_agent_token = { age = "" }
TF_VAR_beszel_user_email = { age = "" }
TF_VAR_beszel_user_password = { age = "" }
TF_VAR_bichon_encrypt_password = { age = "" }
TF_VAR_immich_db_name = { age = "" }
TF_VAR_immich_db_password = { age = "" }
TF_VAR_immich_db_username = { age = "" }
TF_VAR_prowlarr_api_key = { age = "" }
TF_VAR_radarr_api_key = { age = "" }
TF_VAR_sonarr_api_key = { age = "" }
TF_VAR_tailscale_oauth_secret = { age = "" }
TF_VAR_transmission_password = { age = "" }
TF_VAR_transmission_username = { age = "" }
TF_VAR_tsidp_oauth_secret = { age = "" }
TF_VAR_zerobyte_app_secret = { age = "" }
TF_VAR_dev_tailscale_authkey = { age = "" }

[tasks.incus-config]
description = "Write Incus credentials"
run = """
install -d -m 700 .incus .incus/servercerts
printf '%s\n' "$INCUS_CLIENT_CERT" > .incus/client.crt
printf '%s\n' "$INCUS_CLIENT_KEY" > .incus/client.key
printf '%s\n' "$INCUS_SERVER_CERT" > .incus/servercerts/hv01.crt
chmod 600 .incus/client.key
chmod 644 .incus/client.crt .incus/servercerts/hv01.crt
"""

[tasks.init]
description = "Install providers and initialize OpenTofu"
depends = ["incus-config"]
run = "tofu init"

[tasks.fmt]
description = "Format OpenTofu files"
run = "tofu fmt -check -recursive"

[tasks.validate]
description = "Validate the OpenTofu configuration"
depends = ["fmt"]
run = "tofu validate"

[tasks.plan]
description = "Preview infrastructure changes"
depends = ["incus-config"]
run = "tofu plan -out=homelab.tfplan"

[tasks.apply]
description = "Apply the saved infrastructure plan"
depends = ["incus-config"]
confirm = "Apply homelab.tfplan?"
run = "tofu apply homelab.tfplan"
