  pre_tasks:
    - name: Ensure application config directories are present
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: karl
        group: karl
        mode: "0700"
      loop:
        - /home/karl/.config/tailscale
        - /home/karl/.config/recyclarr

    - name: Ensure storage mount points are present
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: karl
        group: karl
        mode: "{{ item.mode }}"
      loop: "{{ storage_mounts }}"

    - name: Mount storage filesystems by UUID
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "UUID={{ item.uuid }}"
        fstype: auto
        opts: nofail,subvol=/
        dump: "0"
        passno: "0"
        state: mounted
      loop: "{{ storage_mounts }}"

    - name: Ensure storage filesystem roots have the expected ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: karl
        group: karl
        mode: "{{ item.mode }}"
      loop: "{{ storage_mounts }}"

    - name: Ensure media directories are present
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: karl
        group: karl
        mode: "0775"
      loop:
        - /mnt/media/shows
        - /mnt/extra1/downloads
        - /mnt/extra1/downloads/complete
        - /mnt/extra1/downloads/incomplete
        - /mnt/extra2/movies

    - name: Ensure IP forwarding is enabled
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_set: true
        sysctl_file: /etc/sysctl.d/99-tailscale-forwarding.conf
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

  roles:
    - role: fedora.linux_system_roles.firewall
      vars:
        firewall:
          - zone: FedoraServer
            interface: eno1
            masquerade: true
            state: enabled
    - role: fedora.linux_system_roles.selinux
      vars:
        selinux_policy: targeted
        selinux_state: enforcing
        selinux_booleans:
          - name: container_use_dri_devices
            state: true
            persistent: true
    - role: fedora.linux_system_roles.sshd
      vars:
        sshd_PermitRootLogin: false
        sshd_PasswordAuthentication: false
        sshd_KbdInteractiveAuthentication: false
        sshd_PubkeyAuthentication: true
        sshd_X11Forwarding: false
        sshd_MaxAuthTries: 3
    - role: fedora.linux_system_roles.cockpit
      vars:
        cockpit_packages:
          - cockpit
          - cockpit-files
          - cockpit-podman
        cockpit_config:
          WebService:
            LoginTo: "false"
            AllowMultiHost: "false"
            MaxStartups: "10:30:60"
          Session:
            IdleTimeout: 15
    - role: fedora.linux_system_roles.podman
