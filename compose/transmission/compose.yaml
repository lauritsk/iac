services:
  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission:version-4.1.3-r0@sha256:81787bc706d3833d252e6d8b94545fea46bf2156f616320991a395619a477d2c
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    cpus: 2
    environment:
      TZ: Europe/Tallinn
      FILE__USER: /run/secrets/transmission_user
      FILE__PASS: /run/secrets/transmission_password
    secrets:
      - source: transmission_user
        target: transmission_user
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: transmission_password
        target: transmission_password
        uid: "1000"
        gid: "1000"
        mode: 0400
    user: "1000:1000"
    userns_mode: keep-id
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:exec
    volumes:
      - transmission:/config:Z,U
      - /mnt/extra1:/data:z
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$(cat /run/secrets/transmission_user):$$(cat /run/secrets/transmission_password)\" http://127.0.0.1:9091/transmission/web/ >/dev/null || exit 1"]

secrets:
  transmission_user:
    file: ../secrets/transmission_user
  transmission_password:
    file: ../secrets/transmission_password

volumes:
  transmission:
    name: transmission

networks:
  proxy:
    name: proxy
