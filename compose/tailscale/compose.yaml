services:
  tailscale:
    container_name: tailscale
    image: docker.io/tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    cpus: 1
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: homelab-proxy
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
    secrets:
      - source: tailscale_authkey
        target: tailscale_authkey
        uid: "1000"
        gid: "1000"
        mode: 0400
    user: "1000:1000"
    userns_mode: keep-id
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
      - /run:rw,nosuid,nodev,mode=755
    volumes:
      - tailscale:/var/lib/tailscale:Z,U
      - ./serve.json:/config/serve.json:ro,Z
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9002/healthz || exit 1"]

secrets:
  tailscale_authkey:
    file: ../secrets/tailscale_authkey

volumes:
  tailscale:
    name: tailscale

networks:
  proxy:
    name: proxy
