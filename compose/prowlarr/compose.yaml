services:
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:version-2.5.2.5491@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    cpus: 1
    environment:
      TZ: Europe/Tallinn
      FILE__PROWLARR__AUTH__APIKEY: /run/secrets/prowlarr_api_key
    secrets:
      - source: prowlarr_api_key
        target: prowlarr_api_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    user: "1000:1000"
    userns_mode: keep-id
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:exec
    volumes:
      - prowlarr:/config:Z,U
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ >/dev/null || exit 1"]

secrets:
  prowlarr_api_key:
    file: ../secrets/prowlarr_api_key

volumes:
  prowlarr:
    name: prowlarr

networks:
  proxy:
    name: proxy
