services:
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:version-4.0.19.2979@sha256:373159ba768e23a3a1c497d9f2b936addf8fd5b1fdce7dd6a14080ac928bfda0
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    cpus: 2
    environment:
      TZ: Europe/Tallinn
      FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr_api_key
    secrets:
      - source: sonarr_api_key
        target: sonarr_api_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    user: "1000:1000"
    userns_mode: keep-id
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:exec
    volumes:
      - sonarr:/config:Z,U
      - /mnt/media/shows:/data/shows:z
      - /mnt/extra1/downloads:/data/downloads:z
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ >/dev/null || exit 1"]

secrets:
  sonarr_api_key:
    file: ../secrets/sonarr_api_key

volumes:
  sonarr:
    name: sonarr

networks:
  proxy:
    name: proxy
